<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Cue</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --bg:#fff; --fg:#000; --sub:rgba(0,0,0,.4); --faint:rgba(0,0,0,.28);
    --line:#e6e6e6; --ink:#000; --inkfg:#fff; --err:#c0392b; --pad:34px;
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#0d0d0d; --fg:#f4f4f4; --sub:rgba(244,244,244,.45); --faint:rgba(244,244,244,.3);
      --line:#242424; --ink:#f4f4f4; --inkfg:#0d0d0d; --err:#ff6b5e; }
  }
  *{ box-sizing:border-box; letter-spacing:0; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font-family:Pretendard,-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column; height:100dvh; overflow:hidden;
  }

  /* ── top: preset + actions ── */
  .head{
    flex:none; display:flex; align-items:center; justify-content:space-between;
    gap:12px; padding:calc(env(safe-area-inset-top) + 16px) var(--pad) 14px;
  }
  .seg{ display:inline-flex; background:transparent; border:1px solid var(--line); border-radius:999px; padding:3px; }
  .seg button{
    font-family:inherit; font-size:13px; font-weight:600; border:none; background:transparent;
    color:var(--sub); padding:7px 15px; border-radius:999px; cursor:pointer;
  }
  .seg button.on{ background:var(--ink); color:var(--inkfg); }
  .acts{ display:flex; gap:16px; }
  .acts button{ font-family:inherit; font-size:13px; font-weight:600; color:var(--sub); background:none; border:none; cursor:pointer; }

  /* ── main output ── */
  .main{ flex:1; display:flex; flex-direction:column; justify-content:center; padding:8px var(--pad); min-height:0; overflow:auto; }
  .out{ margin:0; font-family:Pretendard; font-weight:600; font-size:30px; line-height:1.3; color:var(--fg); text-wrap:pretty; }
  .out.idle{ color:var(--faint); font-weight:500; }
  .ko{ margin:16px 0 0; font-size:16px; line-height:1.3; color:var(--sub); letter-spacing:-1px; font-weight:500; }
  .save{ margin:22px 0 0; display:none; font-size:13px; font-weight:600; color:var(--sub); background:none; border:none; padding:0; cursor:pointer; font-family:inherit; }
  .save.show{ display:inline-block; }
  .save.done{ color:var(--fg); }

  /* ── footer ── */
  .foot{
    flex:none; display:flex; align-items:center; justify-content:space-between;
    padding:12px var(--pad) calc(env(safe-area-inset-bottom) + 16px);
    border-top:1px solid var(--line); font-size:13px; color:var(--sub);
  }
  .foot .status.err{ color:var(--err); }
  .foot .listen{ display:flex; align-items:center; gap:8px; font-weight:600; color:var(--fg); cursor:pointer; }
  .foot .dot{ width:8px; height:8px; border-radius:50%; background:var(--faint); }
  body.listening .foot .dot{ background:var(--ink); animation:blink 1.5s infinite; }
  @keyframes blink{ 0%,100%{opacity:1} 50%{opacity:.2} }
  @media(prefers-reduced-motion:reduce){ .foot .dot{ animation:none !important } }

  /* ── sheets / overlay ── */
  .sheet{ position:fixed; inset:0; z-index:20; display:none; }
  .sheet.open{ display:block; }
  .sheet .scrim{ position:absolute; inset:0; background:rgba(0,0,0,.35); }
  .sheet .panel{
    position:absolute; left:0; right:0; bottom:0; background:var(--bg);
    border-radius:22px 22px 0 0; padding:22px var(--pad) calc(env(safe-area-inset-bottom) + 22px);
    max-height:72dvh; overflow:auto;
  }
  .sheet h2{ margin:0 0 16px; font-size:18px; font-weight:700; }
  .empty{ font-size:14px; color:var(--sub); padding:8px 0 4px; }
  .item{ display:flex; align-items:flex-start; gap:12px; padding:14px 0; border-top:1px solid var(--line); }
  .item:first-of-type{ border-top:none; }
  .item .txt{ flex:1; min-width:0; cursor:pointer; }
  .item .txt .e{ margin:0; font-size:16px; font-weight:600; line-height:1.35; }
  .item .txt .k{ margin:5px 0 0; font-size:13px; color:var(--sub); letter-spacing:-1px; }
  .item .del{ flex:none; font-family:inherit; font-size:18px; color:var(--faint); background:none; border:none; cursor:pointer; line-height:1; padding:2px 4px; }

  input.key{ width:100%; font-family:inherit; font-size:15px; padding:15px 16px; border:1px solid var(--line); border-radius:14px; background:transparent; color:var(--fg); }
  input.key:focus{ outline:none; border-color:var(--ink); }
  .row{ display:flex; align-items:center; justify-content:space-between; padding:14px 0; border-top:1px solid var(--line); }
  .row:first-child{ border-top:none; }
  .row .l{ font-size:15px; font-weight:600; }
  .btn{ width:100%; height:52px; border:none; border-radius:26px; background:var(--ink); color:var(--inkfg); font-family:inherit; font-size:15px; font-weight:700; cursor:pointer; margin-top:16px; }
  .fine{ font-size:12px; color:var(--faint); line-height:1.6; margin:14px 0 0; }

  /* toggle */
  .tg{ width:46px; height:28px; border-radius:999px; background:var(--line); position:relative; cursor:pointer; flex:none; }
  .tg::after{ content:""; position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%; background:#fff; transition:transform .16s; }
  .tg.on{ background:var(--ink); } .tg.on::after{ transform:translateX(18px); }
</style>
</head>
<body>

  <div class="head">
    <div class="seg" id="seg">
      <button data-p="casual" class="on">캐주얼</button>
      <button data-p="business">비즈니스</button>
    </div>
    <div class="acts">
      <button id="openSaved">문장함</button>
      <button id="openSettings">설정</button>
    </div>
  </div>

  <div class="main">
    <p class="out idle" id="out">한국어로 말하면 여기 영어로 떠요</p>
    <p class="ko" id="ko">&nbsp;</p>
    <button class="save" id="save">＋ 문장함에 저장</button>
  </div>

  <div class="foot">
    <span class="status" id="status">시작하려면 오른쪽을 탭</span>
    <span class="listen" id="listen"><span class="dot"></span><span id="listenLabel">시작</span></span>
  </div>

  <!-- 문장함 -->
  <div class="sheet" id="savedSheet">
    <div class="scrim" data-close></div>
    <div class="panel">
      <h2>문장함</h2>
      <div id="savedList"></div>
    </div>
  </div>

  <!-- 설정 -->
  <div class="sheet" id="settingsSheet">
    <div class="scrim" data-close></div>
    <div class="panel">
      <h2>설정</h2>
      <input class="key" id="keyInput" type="password" placeholder="sk-ant-..." autocomplete="off" autocapitalize="off" spellcheck="false">
      <div class="row"><span class="l">상대 자막 (영→한)</span><div class="tg" id="subToggle"></div></div>
      <button class="btn" id="saveKey">저장</button>
      <p class="fine">API 키는 이 브라우저에만 저장돼. 마이크는 HTTPS에서만 켜지고, 크롬(안드로이드/PC)에서 가장 잘 돼. · 상대 자막을 켜면 마이크가 영어를 듣고 한글로 띄워 (안경 통역이 안 될 때만).</p>
    </div>
  </div>

<script>
(function(){
  "use strict";

  var PERSONA =
    "You are the personal live interpreter for a Korean man in his 40s: a design director and AI product builder who loves golf. " +
    "His personality: witty, charming, well-mannered, sharp and quick. He speaks Korean; you output English he will read aloud. " +
    "Keep his meaning and personality — never stiff or word-for-word. Output ONLY the English. No quotes, no notes.";
  var TONE = {
    casual:  "Register: relaxed, friendly, conversational — the way he'd talk to a new friend or on a date.",
    business:"Register: polished and professional but still warm — appropriate for meetings and networking."
  };
  var PARTNER = "Translate the following English (the other person is speaking) into natural, conversational Korean so my user understands instantly. Output ONLY the Korean. No quotes, no notes.";
  var MODEL = "claude-haiku-4-5";

  var $=function(s){return document.getElementById(s);};
  var body=document.body;
  var out=$("out"), koEl=$("ko"), saveBtn=$("save"), statusEl=$("status"), listenLabel=$("listenLabel");

  var apiKey=localStorage.getItem("cue_key")||"";
  var preset=localStorage.getItem("cue_preset")||"casual";
  var subOn=localStorage.getItem("cue_sub")==="1";
  var saved=JSON.parse(localStorage.getItem("cue_saved")||"[]");
  var running=false, recActive=false, rec=null, mode="ko2en", current=null;

  // preset segmented
  Array.prototype.forEach.call($("seg").children,function(b){
    if(b.dataset.p===preset) b.classList.add("on"); else b.classList.remove("on");
    b.onclick=function(){
      preset=b.dataset.p; localStorage.setItem("cue_preset",preset);
      Array.prototype.forEach.call($("seg").children,function(x){x.classList.toggle("on",x===b);});
    };
  });

  // sheets
  function openSheet(id){ $(id).classList.add("open"); }
  function closeSheet(id){ $(id).classList.remove("open"); }
  document.querySelectorAll("[data-close]").forEach(function(s){ s.onclick=function(){ s.closest(".sheet").classList.remove("open"); }; });
  $("openSettings").onclick=function(){ $("keyInput").value=apiKey; $("subToggle").classList.toggle("on",subOn); openSheet("settingsSheet"); };
  $("openSaved").onclick=function(){ renderSaved(); openSheet("savedSheet"); };
  $("subToggle").onclick=function(){ subOn=!subOn; $("subToggle").classList.toggle("on",subOn); localStorage.setItem("cue_sub",subOn?"1":"0"); mode=subOn?"en2ko":"ko2en"; if(running) restartRec(); };
  $("saveKey").onclick=function(){ var k=$("keyInput").value.trim(); if(k){ apiKey=k; localStorage.setItem("cue_key",k);} closeSheet("settingsSheet"); if(apiKey&&!running) start(); };

  // saved phrases
  function persistSaved(){ localStorage.setItem("cue_saved",JSON.stringify(saved.slice(0,100))); }
  saveBtn.onclick=function(){
    if(!current||!current.en) return;
    saved.unshift({en:current.en,ko:current.ko,ts:Date.now()}); persistSaved();
    saveBtn.textContent="✓ 저장됨"; saveBtn.classList.add("done");
  };
  function renderSaved(){
    var list=$("savedList");
    if(!saved.length){ list.innerHTML='<p class="empty">아직 저장된 문장이 없어요. 마음에 드는 영어가 뜨면 “문장함에 저장”을 눌러요.</p>'; return; }
    list.innerHTML="";
    saved.forEach(function(it,i){
      var row=document.createElement("div"); row.className="item";
      var txt=document.createElement("div"); txt.className="txt";
      txt.innerHTML='<p class="e"></p><p class="k"></p>';
      txt.querySelector(".e").textContent=it.en; txt.querySelector(".k").textContent=it.ko||"";
      txt.onclick=function(){ showResult(it.ko||"",it.en); closeSheet("savedSheet"); };
      var del=document.createElement("button"); del.className="del"; del.textContent="×";
      del.onclick=function(e){ e.stopPropagation(); saved.splice(i,1); persistSaved(); renderSaved(); };
      row.appendChild(txt); row.appendChild(del); list.appendChild(row);
    });
  }

  // speech
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  function buildRec(){
    if(!SR){ setStatus("이 브라우저는 음성인식 미지원 (크롬 권장)",true); return null; }
    var r=new SR(); r.lang=(mode==="en2ko")?"en-US":"ko-KR"; r.continuous=true; r.interimResults=true;
    r.onresult=onResult;
    r.onerror=function(e){
      if(e.error==="not-allowed"||e.error==="service-not-allowed"){ setStatus("마이크 권한을 허용해줘",true); running=false; render(); }
      else if(e.error!=="no-speech"){ setStatus("음성 오류: "+e.error,true); }
    };
    r.onend=function(){ recActive=false; if(running){ try{r.start();recActive=true;}catch(_){} } };
    return r;
  }
  function startRec(){ if(!rec)rec=buildRec(); if(!rec||recActive)return; try{rec.start();recActive=true;}catch(_){} }
  function restartRec(){ if(rec){try{rec.stop();}catch(_){}} rec=null; recActive=false; setTimeout(function(){ if(running)startRec(); },200); }

  function onResult(ev){
    var fin="",intr="";
    for(var i=ev.resultIndex;i<ev.results.length;i++){ var t=ev.results[i][0].transcript; if(ev.results[i].isFinal)fin+=t; else intr+=t; }
    if(intr){
      out.classList.remove("idle");
      if(mode==="en2ko"){ out.textContent=intr; }   // partner's live English up top
      else { koEl.textContent=intr; }               // my live Korean in the small line
    }
    if(fin.trim()) handleFinal(fin.trim());
  }

  function handleFinal(text){
    resetSave();
    if(mode==="en2ko"){ out.textContent=text; out.classList.remove("idle"); koEl.textContent="…"; }
    else { koEl.textContent=text; out.textContent="…"; out.classList.remove("idle"); }
    translate(text).then(function(o){
      if(mode==="en2ko"){ koEl.textContent=o; current=null; }
      else { showResult(text,o); }
    }).catch(function(err){ setStatus(err.message||"번역 실패",true); out.textContent="(오류)"; });
  }

  function showResult(ko,en){
    out.textContent=en; out.classList.remove("idle"); koEl.textContent=ko||"";
    current={ko:ko,en:en}; resetSave(); saveBtn.classList.add("show");
  }
  function resetSave(){ saveBtn.classList.remove("done"); saveBtn.textContent="＋ 문장함에 저장"; saveBtn.classList.remove("show"); }

  function translate(text){
    var sys=(mode==="en2ko")?PARTNER:(PERSONA+" "+TONE[preset]);
    return fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",
      headers:{ "content-type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true" },
      body:JSON.stringify({ model:MODEL, max_tokens:400, system:sys, messages:[{role:"user",content:text}] })
    }).then(function(res){
      if(!res.ok){ if(res.status===401) throw new Error("API 키 확인 필요 (설정)"); throw new Error("API 오류 "+res.status); }
      return res.json();
    }).then(function(d){ var b=(d.content||[]).find(function(x){return x.type==="text";}); return b?b.text.trim():""; });
  }

  function setStatus(t,err){ statusEl.textContent=t; statusEl.classList.toggle("err",!!err); }
  function render(){
    body.classList.toggle("listening",running);
    listenLabel.textContent=running?"듣는 중":"시작";
    if(running) setStatus(mode==="en2ko"?"상대 영어를 듣는 중":(preset==="business"?"비즈니스 · 한국어로 말하세요":"캐주얼 · 한국어로 말하세요"));
    else setStatus("시작하려면 오른쪽을 탭");
  }
  function start(){ if(!apiKey){ $("keyInput").value=""; openSheet("settingsSheet"); return; } running=true; startRec(); render(); }
  function stop(){ running=false; if(rec){try{rec.stop();}catch(_){}} recActive=false; render(); }
  $("listen").onclick=function(){ running?stop():start(); };

  render();
  if(!apiKey){ /* wait for user to open settings */ }
})();
</script>
</body>
</html>
