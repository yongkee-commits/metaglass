<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Cue</title>
<style>
  @font-face{font-family:Pretendard;font-weight:400;font-display:swap;src:url("fonts/Pretendard-Regular.woff2") format("woff2")}
  @font-face{font-family:Pretendard;font-weight:500;font-display:swap;src:url("fonts/Pretendard-Medium.woff2") format("woff2")}
  @font-face{font-family:Pretendard;font-weight:600;font-display:swap;src:url("fonts/Pretendard-SemiBold.woff2") format("woff2")}
  @font-face{font-family:Pretendard;font-weight:700;font-display:swap;src:url("fonts/Pretendard-Bold.woff2") format("woff2")}
  :root{
    --bg:#fff; --fg:#000; --sub:rgba(0,0,0,.4); --faint:rgba(0,0,0,.28);
    --line:#000; --green:#00ff26; --err:#c0392b; --pad:34px;
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#0d0d0d; --fg:#f4f4f4; --sub:rgba(244,244,244,.45); --faint:rgba(244,244,244,.3);
      --line:#f4f4f4; --err:#ff6b5e; }
  }
  *{ box-sizing:border-box; margin:0; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{ background:var(--bg); color:var(--fg); font-family:Pretendard,-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased; height:100dvh; overflow:hidden; }
  .app{ height:100dvh; display:flex; flex-direction:column;
    padding:calc(env(safe-area-inset-top) + 45px) var(--pad) calc(env(safe-area-inset-bottom) + 20px); }

  .seg{ position:relative; height:48px; border:1px solid var(--line); border-radius:60px; background:var(--bg); flex:none; }
  .seg .ind{ position:absolute; top:-1px; bottom:-1px; left:-1px; width:calc(50% + 1px); background:var(--line); border-radius:60px; transition:left .18s ease; }
  .seg.biz .ind{ left:50%; }
  .seg button{ position:absolute; top:0; bottom:0; width:50%; border:none; background:transparent; z-index:1;
    font-family:Pretendard; font-weight:500; font-size:16px; letter-spacing:-1px; cursor:pointer; }
  .seg .a{ left:0; } .seg .b{ left:50%; }
  .seg.casual .a{ color:var(--bg); } .seg.casual .b{ color:var(--sub); }
  .seg.biz .a{ color:var(--sub); } .seg.biz .b{ color:var(--bg); }

  .partner{ margin-top:54px; display:flex; flex-direction:column; gap:18px; }
  .rule{ height:1px; background:var(--line); margin-top:44px; }
  .mine{ margin-top:44px; display:flex; flex-direction:column; gap:18px; }
  .spacer{ flex:1 1 auto; min-height:0; }

  .en{ font-family:Pretendard; font-weight:500; font-size:30px; line-height:1.3; color:var(--fg); }
  .mine .en{ font-weight:600; }
  .en.idle{ color:var(--faint); }
  .ko{ font-family:Pretendard; font-weight:500; font-size:16px; line-height:1.3; color:var(--sub); letter-spacing:-1px; }

  .w{ position:relative; white-space:nowrap; }
  .w .pron{ position:absolute; left:50%; top:100%; transform:translate(-50%,-46%);
    background:var(--green); color:#000; font-family:Pretendard; font-weight:600; font-size:9.333px; line-height:1.3;
    padding:3px 6px; border-radius:40px; text-transform:uppercase; white-space:nowrap; pointer-events:none; }

  .status{ flex:none; text-align:center; font-family:Pretendard; font-size:12px; color:var(--faint); padding-top:14px; cursor:pointer; }
  .status.err{ color:var(--err); }
  .status .rec{ display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--fg); vertical-align:middle; margin-right:6px; animation:blink 1.4s infinite; }
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.2}} @media(prefers-reduced-motion:reduce){.status .rec{animation:none}}

  .sheet{ position:fixed; inset:0; z-index:20; display:none; }
  .sheet.open{ display:block; }
  .sheet .scrim{ position:absolute; inset:0; background:rgba(0,0,0,.4); }
  .sheet .panel{ position:absolute; left:0; right:0; bottom:0; background:var(--bg);
    border-radius:22px 22px 0 0; padding:24px var(--pad) calc(env(safe-area-inset-bottom) + 24px); max-height:80dvh; overflow:auto; }
  .sheet h2{ font-family:Pretendard; font-size:18px; font-weight:700; margin-bottom:16px; }
  .sheet .lbl{ font-size:13px; color:var(--sub); margin:16px 0 8px; }
  .sheet .lbl:first-of-type{ margin-top:0; }
  input.key{ width:100%; font-family:Pretendard; font-size:15px; padding:15px 16px; border:1px solid var(--sub); border-radius:14px; background:transparent; color:var(--fg); }
  input.key:focus{ outline:none; border-color:var(--fg); }
  .btn{ width:100%; height:52px; border:none; border-radius:26px; background:var(--line); color:var(--bg); font-family:Pretendard; font-size:15px; font-weight:700; cursor:pointer; margin-top:20px; }
  .link{ display:block; width:100%; text-align:left; background:none; border:none; font-family:Pretendard; font-size:15px; font-weight:600; color:var(--fg); padding:14px 0; border-top:1px solid var(--sub); margin-top:18px; cursor:pointer; }
  .fine{ font-size:12px; color:var(--faint); line-height:1.6; margin-top:14px; }
  .item{ display:flex; gap:12px; padding:14px 0; border-top:1px solid var(--sub); }
  .item:first-of-type{ border-top:none; }
  .item .t{ flex:1; cursor:pointer; }
  .item .t .e{ font-size:16px; font-weight:600; }
  .item .t .k{ font-size:13px; color:var(--sub); letter-spacing:-1px; margin-top:4px; }
  .item .x{ background:none; border:none; font-size:18px; color:var(--faint); cursor:pointer; }
  .empty{ font-size:14px; color:var(--sub); }
</style>
</head>
<body>
  <div class="app" id="app">
    <div class="seg casual" id="seg">
      <div class="ind"></div>
      <button class="a" data-int data-p="casual">캐쥬얼</button>
      <button class="b" data-int data-p="business">비즈니스</button>
    </div>

    <div class="partner">
      <div class="en" id="pEn">so, any hobbies outside of work?</div>
      <div class="ko" id="pKo">일 말고 취미는 좀 있어요?</div>
    </div>

    <div class="rule"></div>

    <div class="mine">
      <div class="en" id="mEn"></div>
      <div class="ko" id="mKo">골프 완전 좋아해요. 주말마다 라운딩 나가고 요즘은 스윙 교정 중이에요.</div>
    </div>

    <div class="spacer"></div>
    <div class="status" id="status" data-int>설정</div>
  </div>

  <div class="sheet" id="sheet">
    <div class="scrim" data-close></div>
    <div class="panel" id="panel"></div>
  </div>

<script>
(function(){
  "use strict";

  var PERSONA =
    "You are the personal live interpreter for a Korean man in his 40s: a design director and AI product builder who loves golf. " +
    "Personality: witty, charming, well-mannered, sharp, quick. He speaks Korean; you output English he'll read aloud — natural and spoken, never stiff or literal, keeping his personality.";
  var TONE = { casual:"Register: relaxed, friendly, conversational (new friend / date).",
               business:"Register: polished, professional but warm (meeting / networking)." };
  var FORMAT =
    " Respond with ONLY a JSON object: {\"en\":\"<the English>\",\"hints\":[{\"word\":\"<exact word copied from en>\",\"pron\":\"<Korean hangul pronunciation>\"}]}. " +
    "In hints, pick 0-4 words a Korean speaker may find hard to pronounce. Copy each word exactly as it appears in en. No markdown, no extra text.";
  var PARTNER = "Translate this English (the other person is speaking) into natural conversational Korean so my user understands. Output ONLY the Korean, no quotes.";
  var CLAUDE_MODEL = "claude-haiku-4-5";
  var STT_MODEL = "whisper-1";

  var $=function(s){return document.getElementById(s);};
  var pEn=$("pEn"), pKo=$("pKo"), mEn=$("mEn"), mKo=$("mKo"), statusEl=$("status"), seg=$("seg");

  var apiKey=localStorage.getItem("cue_key")||"";       // Claude
  var oaKey=localStorage.getItem("cue_okey")||"";        // OpenAI (whisper)
  var preset=localStorage.getItem("cue_preset")||"casual";
  var saved=JSON.parse(localStorage.getItem("cue_saved")||"[]");
  var current=null, listening=false;

  renderOut("I’m really into golf. I play every weekend, and lately I’ve been fixing my swing.",
    [{word:"weekend",pron:"위켄드"},{word:"lately",pron:"레이틀리"},{word:"swing",pron:"스윙"}]);

  seg.className="seg "+(preset==="business"?"biz":"casual");
  Array.prototype.forEach.call(seg.querySelectorAll("button"),function(b){
    b.onclick=function(){ preset=b.dataset.p; localStorage.setItem("cue_preset",preset);
      seg.className="seg "+(preset==="business"?"biz":"casual"); };
  });

  function esc(s){ return s.replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function escReg(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
  function renderOut(en, hints){
    var html=esc(en);
    (hints||[]).forEach(function(h){
      if(!h||!h.word||!h.pron) return;
      var w=esc(String(h.word));
      var re=new RegExp('(^|[^\\w])('+escReg(w)+')(?=[^\\w]|$)');
      if(re.test(html)) html=html.replace(re,'$1<span class="w">$2<span class="pron">'+esc(String(h.pron))+'</span></span>');
    });
    mEn.innerHTML=html; mEn.classList.remove("idle");
  }

  // ---- Claude translate ----
  function ask(text, mode){
    var sys = mode==="partner" ? PARTNER : (PERSONA+" "+TONE[preset]+FORMAT);
    return fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",
      headers:{ "content-type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true" },
      body:JSON.stringify({ model:CLAUDE_MODEL, max_tokens:500, system:sys, messages:[{role:"user",content:text}] })
    }).then(function(r){ if(!r.ok){ if(r.status===401) throw new Error("Claude 키 확인 (설정)"); throw new Error("번역 오류 "+r.status);} return r.json(); })
     .then(function(d){ var b=(d.content||[]).find(function(x){return x.type==="text";}); return b?b.text.trim():""; });
  }
  function handleMine(korean){
    mKo.textContent=korean; mEn.textContent="…"; mEn.classList.remove("idle");
    ask(korean,"mine").then(function(raw){
      var obj=null; try{ obj=JSON.parse(raw); }catch(_){ var m=raw.match(/\{[\s\S]*\}/); if(m){ try{obj=JSON.parse(m[0]);}catch(__){} } }
      if(obj&&obj.en){ renderOut(obj.en,obj.hints||[]); current={ko:korean,en:obj.en}; }
      else { mEn.textContent=raw||"(응답 없음)"; current={ko:korean,en:raw}; }
    }).catch(function(e){ setStatus(e.message,true); mEn.textContent="(오류)"; });
  }
  function handlePartner(english){
    pEn.textContent=english; pKo.textContent="…";
    ask(english,"partner").then(function(ko){ pKo.textContent=ko; })
    .catch(function(e){ setStatus(e.message,true); pKo.textContent="(오류)"; });
  }

  // ---- OpenAI whisper transcription (auto language) ----
  function transcribe(blob){
    var fd=new FormData();
    fd.append("file", blob, "audio.webm");
    fd.append("model", STT_MODEL);
    fd.append("response_format","json");
    return fetch("https://api.openai.com/v1/audio/transcriptions",{
      method:"POST", headers:{ "Authorization":"Bearer "+oaKey }, body:fd
    }).then(function(r){ if(!r.ok){ if(r.status===401) throw new Error("OpenAI 키 확인 (설정)"); throw new Error("음성인식 오류 "+r.status);} return r.json(); })
     .then(function(d){ return (d.text||"").trim(); });
  }
  function route(text){
    if(!text) return;
    if(/[가-힣]/.test(text)) handleMine(text);   // has Hangul → my Korean
    else handlePartner(text);                             // else → partner English
  }

  // ---- mic capture + simple VAD (speak-only chunks) ----
  var mediaStream=null, audioCtx=null, analyser=null, recorder=null, chunks=[], rafId=null;
  var speaking=false, hadSpeech=false, silenceStart=0, speechStart=0, buf=null;
  var THRESH=6, SILENCE_MS=850, MAX_MS=9000;

  function pickMime(){
    var opts=["audio/webm;codecs=opus","audio/webm","audio/mp4","audio/aac"];
    for(var i=0;i<opts.length;i++){ if(window.MediaRecorder && MediaRecorder.isTypeSupported(opts[i])) return opts[i]; }
    return "";
  }
  function newRecorder(){
    var mime=pickMime();
    var r = mime ? new MediaRecorder(mediaStream,{mimeType:mime}) : new MediaRecorder(mediaStream);
    r.ondataavailable=function(e){ if(e.data&&e.data.size>0) chunks.push(e.data); };
    r.onstop=function(){
      var b=new Blob(chunks,{type:r.mimeType||"audio/webm"}); chunks=[];
      if(hadSpeech && b.size>1200){ transcribe(b).then(route).catch(function(e){ setStatus(e.message,true); }); }
      hadSpeech=false;
      if(listening){ try{ recorder=newRecorder(); recorder.start(); }catch(_){} }
    };
    return r;
  }
  function monitor(){
    if(!listening) return;
    analyser.getByteTimeDomainData(buf);
    var sum=0; for(var i=0;i<buf.length;i++){ sum+=Math.abs(buf[i]-128); }
    var level=sum/buf.length, now=performance.now();
    if(level>THRESH){ if(!speaking){ speaking=true; speechStart=now; } hadSpeech=true; silenceStart=0; }
    else if(speaking){ if(!silenceStart) silenceStart=now; else if(now-silenceStart>SILENCE_MS){ cut(); } }
    if(speaking && now-speechStart>MAX_MS){ cut(); }
    rafId=requestAnimationFrame(monitor);
  }
  function cut(){ speaking=false; silenceStart=0; if(recorder && recorder.state==="recording"){ try{ recorder.stop(); }catch(_){} } }

  function startListening(){
    if(!apiKey||!oaKey){ openSettings(); return; }
    navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}}).then(function(s){
      mediaStream=s;
      audioCtx=new (window.AudioContext||window.webkitAudioContext)();
      var src=audioCtx.createMediaStreamSource(s);
      analyser=audioCtx.createAnalyser(); analyser.fftSize=1024; buf=new Uint8Array(analyser.fftSize);
      src.connect(analyser);
      recorder=newRecorder(); recorder.start();
      listening=true; paint(); monitor();
    }).catch(function(){ setStatus("마이크 권한을 허용해줘",true); });
  }
  function stopListening(){
    listening=false; if(rafId) cancelAnimationFrame(rafId);
    if(recorder && recorder.state==="recording"){ try{ recorder.stop(); }catch(_){} }
    if(mediaStream){ mediaStream.getTracks().forEach(function(t){ t.stop(); }); mediaStream=null; }
    if(audioCtx){ try{ audioCtx.close(); }catch(_){} audioCtx=null; }
    speaking=false; hadSpeech=false; paint();
  }

  // ---- interaction ----
  $("app").addEventListener("click",function(e){ if(e.target.closest("[data-int]")) return; listening?stopListening():startListening(); });
  statusEl.addEventListener("click",function(e){ e.stopPropagation(); if(!listening) openSettings(); else stopListening(); });

  function setStatus(t,err){ statusEl.textContent=t; statusEl.classList.toggle("err",!!err); statusEl._m="msg"; }
  function paint(){
    statusEl.classList.remove("err");
    if(listening){ statusEl.innerHTML='<span class="rec"></span>듣는 중 · 그냥 말하면 자동 (탭하면 정지)'; statusEl._m="live"; }
    else { statusEl.textContent="설정"; statusEl._m="idle"; }
  }

  // ---- settings / saved ----
  function openSheet(){ $("sheet").classList.add("open"); }
  function closeSheet(){ $("sheet").classList.remove("open"); }
  document.querySelector("[data-close]").onclick=closeSheet;
  function openSettings(){
    $("panel").innerHTML=
      '<h2>설정</h2>'+
      '<div class="lbl">Claude API 키 (번역)</div>'+
      '<input class="key" id="k1" type="password" placeholder="sk-ant-..." autocomplete="off" autocapitalize="off" spellcheck="false">'+
      '<div class="lbl">OpenAI API 키 (음성인식·자동 언어감지)</div>'+
      '<input class="key" id="k2" type="password" placeholder="sk-..." autocomplete="off" autocapitalize="off" spellcheck="false">'+
      '<button class="btn" id="ks">저장</button>'+
      '<button class="link" id="openSaved">문장함 열기</button>'+
      '<p class="fine">두 키 모두 이 브라우저에만 저장돼. 화면 아무 데나 탭하면 듣기 시작/정지 — 그냥 말하면 한/영 알아서 구분해. 마이크는 HTTPS(크롬 권장)에서만 켜져.</p>';
    $("k1").value=apiKey; $("k2").value=oaKey;
    $("ks").onclick=function(){ var a=$("k1").value.trim(), o=$("k2").value.trim();
      if(a){apiKey=a;localStorage.setItem("cue_key",a);} if(o){oaKey=o;localStorage.setItem("cue_okey",o);} closeSheet(); };
    $("openSaved").onclick=renderSaved;
    openSheet();
  }
  function persist(){ localStorage.setItem("cue_saved",JSON.stringify(saved.slice(0,100))); }
  function renderSaved(){
    var h='<h2>문장함</h2>';
    if(current&&current.en) h+='<button class="btn" id="addcur" style="margin-top:0">＋ 지금 문장 저장</button>';
    if(!saved.length) h+='<p class="empty" style="margin-top:16px">아직 저장된 문장이 없어요.</p>';
    else h+='<div style="margin-top:16px" id="slist"></div>';
    $("panel").innerHTML=h;
    if($("addcur")) $("addcur").onclick=function(){ saved.unshift({en:current.en,ko:current.ko,ts:0}); persist(); renderSaved(); };
    if(saved.length){ var L=$("slist"); saved.forEach(function(it,i){
      var row=document.createElement("div"); row.className="item";
      var t=document.createElement("div"); t.className="t"; t.innerHTML='<div class="e"></div><div class="k"></div>';
      t.querySelector(".e").textContent=it.en; t.querySelector(".k").textContent=it.ko||"";
      t.onclick=function(){ mKo.textContent=it.ko||""; renderOut(it.en,[]); current={ko:it.ko,en:it.en}; closeSheet(); };
      var x=document.createElement("button"); x.className="x"; x.textContent="×"; x.onclick=function(){ saved.splice(i,1); persist(); renderSaved(); };
      row.appendChild(t); row.appendChild(x); L.appendChild(row);
    }); }
    openSheet();
  }

  paint();
})();
</script>
</body>
</html>
